<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FDF3E2"/>
      <stop offset="78%" stop-color="#F7E5CB"/>
      <stop offset="100%" stop-color="#EFD9B8"/>
    </radialGradient>
  </defs>
  <!-- disc -->
  <circle cx="256" cy="256" r="250" fill="url(#disc)"/>
  <!-- outer ring (terracotta) -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#B56B4F" stroke-width="7"/>
  <!-- inner fine ring (taupe) -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#C6A288" stroke-width="2.5"/>
  <!-- brand wordmark -->
  <text x="256" y="252" text-anchor="middle" font-size="118" font-family="Georgia, 'Times New Roman', 'Noto Serif Devanagari', 'Kohinoor Devanagari', serif" font-weight="600" fill="#51100A">बारामासी</text>
  <!-- latin line -->
  <text x="256" y="330" text-anchor="middle" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-weight="600" letter-spacing="7" fill="#7A3B24">BARAMASI</text>
  <!-- small flourish lines -->
  <path d="M186 372h34" stroke="#B56B4F" stroke-width="3" stroke-linecap="round"/>
  <path d="M292 372h34" stroke="#B56B4F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="372" r="3.5" fill="#B56B4F"/>
  <text x="256" y="412" text-anchor="middle" font-size="27" font-family="Georgia, 'Times New Roman', serif" letter-spacing="10" fill="#A65B3F">BETTIAH</text>
</svg>
