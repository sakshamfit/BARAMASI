<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout — BARAMASI</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/commerce.css">
</head>
<body class="commerce past-hero" data-page="checkout">

  <header id="siteHeader"></header>

  <main class="com-main">
    <h1 class="com-h1" data-i18n="com.checkout.h">Checkout</h1>
    <hr class="com-rule">

    <p class="ck-banner">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-6.5-4.8-8.6-9.3C1.9 8.4 4.2 5 7.6 5c1.9 0 3.3.9 4.4 2.4C13.1 5.9 14.5 5 16.4 5c3.4 0 5.7 3.4 4.2 6.7C18.5 16.2 12 21 12 21Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span data-i18n="com.hydOnly">We’re currently delivering around Bettiah — or collect in store.</span>
    </p>

    <!-- step 1 · address -->
    <section id="addrStep" aria-labelledby="addrH">
      <h2 class="com-h2 ck-review-h" id="addrH" data-i18n="com.step.addr">Delivery Address</h2>
      <form id="addrForm" novalidate>
        <div class="cf-row">
          <label for="adName" data-i18n="com.addr.fullname">Full Name</label>
          <input id="adName" name="fullname" type="text" autocomplete="name">
        </div>
        <div class="cf-row">
          <label for="adPhone" data-i18n="com.addr.phone">Contact Number</label>
          <input id="adPhone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="10">
        </div>
        <div class="cf-row">
          <label for="adHouse" data-i18n="com.addr.house">Flat / House No., Building</label>
          <input id="adHouse" name="house" type="text" autocomplete="address-line1">
        </div>
        <div class="cf-row">
          <label for="adStreet" data-i18n="com.addr.street">Street & Area</label>
          <input id="adStreet" name="street" type="text" autocomplete="address-line2">
        </div>
        <div class="cf-row">
          <label for="adLandmark" data-i18n="com.addr.landmark">Landmark (optional)</label>
          <input id="adLandmark" name="landmark" type="text">
        </div>
        <div class="addr-2col">
          <div class="cf-row">
            <label for="adCity" data-i18n="com.addr.city">City</label>
            <input id="adCity" name="city" type="text" autocomplete="address-level2" value="Bettiah">
          </div>
          <div class="cf-row">
            <label for="adPin" data-i18n="com.addr.pincode">Pincode</label>
            <input id="adPin" name="pincode" type="text" autocomplete="postal-code" inputmode="numeric" maxlength="6">
          </div>
        </div>
        <div class="cf-row">
          <label for="adState" data-i18n="com.addr.state">State</label>
          <input id="adState" name="state" type="text" autocomplete="address-level1" value="Bihar">
        </div>
        <span id="addrErr" class="cf-err" role="alert" aria-live="polite"></span>
        <button type="submit" class="ct-btn auth-submit">
          <span data-i18n="com.addr.continue">Continue to Review</span>
          <svg viewBox="0 0 26 12" fill="none" aria-hidden="true"><path d="M1 6h23m0 0-4.6-4.6M24 6l-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <!-- step 2 · review -->
    <section id="reviewStep" hidden aria-labelledby="reviewH">
      <h2 class="com-h2 ck-review-h" id="reviewH" data-i18n="com.step.review">Review & Place Order</h2>

      <h3 class="com-eyebrow" data-i18n="com.review.items">Your Items</h3>
      <ul id="reviewItems"></ul>
      <div class="cs-row"><span data-i18n="com.total">Total</span><strong id="reviewTotal"></strong></div>

      <h3 class="com-eyebrow" style="margin-top:3.5vh" data-i18n="com.review.addr">Delivering To</h3>
      <p class="review-addr" id="reviewAddr"></p>

      <p class="cs-note" data-i18n="com.wa.reviewNote">Placing your order opens WhatsApp with your items &amp; address ready to send.</p>

      <div class="review-actions">
        <button id="placeOrder" class="ct-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          <span data-i18n="com.wa.placeOrder">Place Order on WhatsApp</span>
        </button>
        <button id="backToAddr" class="ck-back" data-i18n="com.back">Edit Address</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/commerce.js"></script>
</body>
</html>
